name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: omnicrm_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: omnicrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnicrm_ci -d omnicrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci --prefix tests/browser --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare disposable test configuration
        run: |
          python - <<'PY'
          import json, os, pathlib, secrets
          from cryptography.fernet import Fernet
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          config = folder / 'fencing-postgres.json'
          with os.fdopen(os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as stream:
              json.dump({'url': 'postgresql+psycopg://omnicrm_ci:ephemeral-ci-only@127.0.0.1:5432/omnicrm_ci'}, stream)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, value in {
                  'FENCING_POSTGRES_URL_FILE': str(config),
                  'DATABASE_URL': 'sqlite:///' + str(folder / 'omnicrm-ci.db'),
                  'APP_ENV': 'development', 'LOCAL_TEST_MODE': 'false', 'DEMO_MODE': 'false',
                  'ENCRYPTION_KEY': Fernet.generate_key().decode(), 'JWT_SECRET': secrets.token_urlsafe(48),
                  'NODE_PATH': str(pathlib.Path('tests/browser/node_modules').resolve()),
              }.items():
                  stream.write(key + '=' + value + '\n')
          PY
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("./tests/browser/node_modules/playwright").chromium.executablePath() + "\n")'
      - name: Python tests including actual PostgreSQL fencing
        run: |
          python -m pytest -q -ra --junitxml="$RUNNER_TEMP/pytest.xml"
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP']) / 'pytest.xml')
          name = 'test_postgres_takeover_waits_for_mutation_commit_and_rejects_old_epoch'
          matching = [test for test in report.iter('testcase') if test.get('name') == name]
          assert len(matching) == 1 and matching[0].find('skipped') is None, 'Actual PostgreSQL fencing test must run'
          PY
      - name: Updater safety and shell syntax
        run: |
          python tests/update_pilot_smoke.py
          for script in scripts/*.sh scripts/*.command Start.command Stop.command; do
            bash -n "$script"
          done
      - name: Browser connection flows and history regression
        run: |
          node tests/frontend_connection.cjs
          node --test tests/frontend_history.mjs
      - name: Build application image and check imports without network
        run: |
          docker build --tag omnicrm:ci .
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python omnicrm:ci -c 'import ast,pathlib; [ast.parse(p.read_text()) for root in ("app","scripts") for p in pathlib.Path(root).rglob("*.py")]; import app.api, app.worker; from app.adapters import telegram, whatsapp_web, max_personal, official; print("OFFLINE_IMPORT_OK")'
      - name: Build and verify source-only release
        run: |
          python scripts/package_release.py --output-dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check omnicrm-server-pilot.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/omnicrm-server-pilot.tar.gz
            ${{ runner.temp }}/release/omnicrm-server-pilot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Delete disposable credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/fencing-postgres.json"
